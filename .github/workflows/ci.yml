name: Verify public KLayout integration source
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  source-and-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python scripts/verify-source.py
      - run: python scripts/klayout-linux-package.test.py
      - run: python -m py_compile src-tauri/src/native_klayout_linux.py
  rust-package:
    timeout-minutes: 20
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.91.1 --profile minimal
      - run: cargo test --locked
      - run: cargo run --locked -- descriptor
